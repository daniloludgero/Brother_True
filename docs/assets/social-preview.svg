<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">BrotherTrue — Open-System Biocognitive Architecture &amp; Epistemic Workbench</title>
  <desc id="og-desc">1280x640 OpenGraph social preview card for BrotherTrue featuring pixel-stepped warm-and-cool dual convergence emblem under a golden homeostatic halo, 8-node pipeline summary, and scientific verification metrics.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#060B1B" />
      <stop offset="100%" stop-color="#040916" />
    </linearGradient>
    <pattern id="ogGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#111C3A" stroke-width="1" />
    </pattern>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAEFC1" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#E5B031" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#060B1B" stop-opacity="0" />
    </radialGradient>
    <style>
      .eyebrow { fill: #E5B031; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; font-weight: 800; letter-spacing: 3px; }
      .b-warm  { fill: #FBA049; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 74px; font-weight: 900; letter-spacing: 2px; }
      .b-cool  { fill: #31B1E0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 74px; font-weight: 900; letter-spacing: 2px; }
      .pitch   { fill: #F8FAFC; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 23px; font-weight: 700; }
      .sub     { fill: #CBB694; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; font-variant-numeric: tabular-nums; }
      .pill-w  { fill: #141628; stroke: #FBA049; stroke-width: 2; rx: 8; }
      .pill-g  { fill: #171928; stroke: #E5B031; stroke-width: 2; rx: 8; }
      .pill-c  { fill: #0D1B34; stroke: #31B1E0; stroke-width: 2; rx: 8; }
      .pill-t  { fill: #FAEFC1; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bgGrad)" />
  <rect width="1280" height="640" fill="url(#ogGrid)" opacity="0.7" />
  <rect x="24" y="24" width="1232" height="592" rx="16" fill="none" stroke="#1B2C7E" stroke-width="3" />

  <!-- Stepped 16-bit Pixel Corner Brackets -->
  <g shape-rendering="crispEdges">
    <rect x="44" y="44" width="40" height="6" fill="#FBA049" />
    <rect x="44" y="44" width="6" height="40" fill="#FBA049" />
    <rect x="1196" y="44" width="40" height="6" fill="#31B1E0" />
    <rect x="1230" y="44" width="6" height="40" fill="#31B1E0" />
    <rect x="44" y="590" width="40" height="6" fill="#FBA049" />
    <rect x="44" y="556" width="6" height="40" fill="#FBA049" />
    <rect x="1196" y="590" width="40" height="6" fill="#31B1E0" />
    <rect x="1230" y="556" width="6" height="40" fill="#31B1E0" />
  </g>

  <!-- Left Crest -->
  <circle cx="235" cy="270" r="145" fill="url(#haloGlow)" />
  <ellipse cx="235" cy="145" rx="74" ry="15" fill="none" stroke="#E5B031" stroke-width="5" />
  <ellipse cx="235" cy="145" rx="60" ry="8" fill="none" stroke="#FAEFC1" stroke-width="2" />

  <g shape-rendering="crispEdges" transform="translate(80, 120) scale(1.55)">
    <rect x="20" y="138" width="16" height="12" fill="#901000" />
    <rect x="28" y="122" width="16" height="16" fill="#D83800" />
    <rect x="36" y="102" width="16" height="20" fill="#D83800" />
    <rect x="46" y="82"  width="18" height="20" fill="#FBA049" />
    <rect x="58" y="66"  width="20" height="16" fill="#FBA049" />
    <rect x="72" y="58"  width="22" height="12" fill="#E5B031" />
    <rect x="66" y="98"  width="26" height="10" fill="#FBA049" />

    <rect x="164" y="138" width="16" height="12" fill="#081840" />
    <rect x="156" y="122" width="16" height="16" fill="#1B2C7E" />
    <rect x="148" y="102" width="16" height="20" fill="#1B2C7E" />
    <rect x="136" y="82"  width="18" height="20" fill="#31B1E0" />
    <rect x="122" y="66"  width="20" height="16" fill="#31B1E0" />
    <rect x="106" y="58"  width="22" height="12" fill="#52AEE2" />
    <rect x="108" y="98"  width="26" height="10" fill="#31B1E0" />

    <rect x="94" y="56"  width="12" height="14" fill="#FAEFC1" />
    <rect x="92" y="96"  width="16" height="14" fill="#FAEFC1" />
    <rect x="96" y="92"  width="8"  height="22" fill="#FFFFFF" />
    <rect x="88" y="100" width="24" height="6"  fill="#FFFFFF" />
  </g>

  <!-- Right Copy -->
  <text x="440" y="148" class="eyebrow">OPEN-SYSTEM BIOCOGNITIVE ARCHITECTURE (Ψ ⇄ ζ)</text>
  <text x="440" y="232"><tspan class="b-warm">BROTHER</tspan><tspan class="b-cool">TRUE</tspan></text>
  <rect x="440" y="254" width="360" height="4" fill="#FBA049" />
  <rect x="800" y="254" width="380" height="4" fill="#31B1E0" />
  <rect x="795" y="251" width="10" height="10" fill="#FAEFC1" />

  <text x="440" y="304" class="pitch">Continuous Qualia ODEs + Hill Neurochemistry (nM)</text>
  <text x="440" y="338" class="pitch">coupled to an Authorial Autoregressive Decoder.</text>
  <text x="440" y="384" class="sub">8-Node Canonical Pipeline  •  RAG Evidence Gate  •  Auditable &lt;thought&gt; Projection</text>
  <text x="440" y="414" class="sub">Open-System O(N) Integrity vs. Closed O(1) Complacency  •  Zero Copied Assets</text>

  <!-- Bottom 4 Capability Pills -->
  <rect x="76"  y="492" width="268" height="58" class="pill-w" />
  <text x="210" y="527" class="pill-t">8/8 AST NODES CONFORMANT</text>

  <rect x="364" y="492" width="268" height="58" class="pill-g" />
  <text x="498" y="527" class="pill-t">COLLAPSE GUARD: E &gt; E_crit</text>

  <rect x="652" y="492" width="268" height="58" class="pill-c" />
  <text x="786" y="527" class="pill-t">31/31 OWN-VOICE CONTRACTS</text>

  <rect x="940" y="492" width="264" height="58" class="pill-c" />
  <text x="1072" y="527" class="pill-t">INTERACTIVE WEB LAB</text>
</svg>
